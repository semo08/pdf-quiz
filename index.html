<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정처기 실기 문제풀이</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== SCREEN 1: UPLOAD ===== -->
  <div id="screen-upload" class="screen active">
    <div class="upload-container">
      <h1>📚 정처기 실기 문제풀이</h1>
      <p class="upload-subtitle">PDF를 업로드하면 문제풀이 앱으로 변환됩니다.</p>

      <button id="btn-continue" class="btn-continue hidden">
        📖 이전 문제집 이어하기
      </button>

      <div class="upload-zones">
        <div class="upload-zone" id="drop-pdf">
          <div class="zone-icon">📄</div>
          <div class="zone-label">PDF 업로드</div>
          <div class="zone-desc">문제 PDF 파일을 여기에 끌어다 놓거나<br />클릭해서 선택하세요 (여러 개 가능)</div>
          <input type="file" id="input-pdf" accept=".pdf" multiple hidden />
          <div id="pdf-filelist" class="file-list"></div>
          <button class="btn-parse hidden" id="btn-parse">파싱 시작 →</button>
        </div>

        <div class="upload-zone-divider">또는</div>

        <div class="upload-zone" id="drop-json">
          <div class="zone-icon">💾</div>
          <div class="zone-label">JSON 불러오기</div>
          <div class="zone-desc">이전에 저장한 문제집 JSON 파일을<br />여기에 끌어다 놓거나 클릭하세요</div>
          <input type="file" id="input-json" accept=".json" hidden />
        </div>
      </div>

      <div id="parse-progress" class="parse-progress hidden">
        <div class="progress-bar-wrap"><div id="progress-bar" class="progress-bar"></div></div>
        <div id="progress-label" class="progress-label">파싱 중...</div>
      </div>
    </div>
  </div>

  <!-- ===== SCREEN 2: REVIEW ===== -->
  <div id="screen-review" class="screen">
    <div class="review-header">
      <div>
        <h2>파싱 결과 검토</h2>
        <p id="review-summary" class="review-summary"></p>
      </div>
      <button id="btn-save-start" class="btn-primary">완료 + JSON 저장 →</button>
    </div>

    <div class="review-table-wrap">
      <table id="review-table">
        <thead>
          <tr>
            <th>#</th>
            <th>카테고리</th>
            <th>문제 (요약)</th>
            <th>코드</th>
            <th>정답</th>
            <th>해설</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="review-tbody"></tbody>
      </table>
    </div>

    <!-- 인라인 편집 모달 -->
    <div id="edit-modal" class="modal hidden">
      <div class="modal-box">
        <h3>문제 편집</h3>
        <label>카테고리
          <select id="edit-category">
            <option value="keyword">📝 키워드 찾기</option>
            <option value="sql">🗄 SQL</option>
            <option value="c_ctrl">⚙️ 제어문 (C)</option>
            <option value="c_ptr">🔷 포인터 (C)</option>
            <option value="c_struct">📦 구조체 (C)</option>
            <option value="c_func">🔧 사용자함수 (C)</option>
            <option value="java">☕ JAVA</option>
            <option value="python">🐍 Python</option>
          </select>
        </label>
        <label>문제 (질문)
          <textarea id="edit-question" rows="3"></textarea>
        </label>
        <label>코드 (없으면 비워두기)
          <textarea id="edit-code" rows="8" class="code-textarea"></textarea>
        </label>
        <label>정답
          <input id="edit-answer" type="text" />
        </label>
        <label>해설 (없으면 비워두기)
          <textarea id="edit-explanation" rows="4"></textarea>
        </label>
        <div class="modal-actions">
          <button id="btn-modal-delete" class="btn-danger">삭제</button>
          <button id="btn-modal-cancel" class="btn-secondary">취소</button>
          <button id="btn-modal-save" class="btn-primary">저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== SCREEN 3: QUIZ ===== -->
  <div id="screen-quiz" class="screen">
    <aside id="sidebar">
      <div class="sidebar-title">📚 정처기 실기</div>

      <nav id="category-nav"></nav>

      <div id="problem-nav-wrap">
        <div id="problem-nav-label" class="problem-nav-label"></div>
        <div id="problem-nav" class="problem-nav"></div>
      </div>

      <div class="sidebar-footer">
        <button id="btn-back-upload" class="btn-sidebar-action">⬆ 문제집 바꾸기</button>
      </div>
    </aside>

    <main id="quiz-main">
      <div id="problem-header">
        <span id="problem-badge" class="badge"></span>
        <span id="problem-counter" class="problem-counter"></span>
      </div>

      <p id="problem-question" class="problem-question"></p>

      <div id="code-wrap" class="code-wrap hidden">
        <pre><code id="code-content"></code></pre>
      </div>

      <div id="answer-area" class="answer-area">
        <input id="answer-input" type="text" placeholder="출력값 또는 정답 입력 후 Enter..." autocomplete="off" />
        <button id="btn-check" class="btn-primary">확인</button>
      </div>

      <div id="feedback" class="feedback hidden">
        <div id="feedback-result" class="feedback-result"></div>
        <button id="btn-explanation" class="btn-toggle hidden">해설 보기 ▼</button>
        <div id="explanation-text" class="explanation-text hidden"></div>
        <div class="feedback-actions">
          <button id="btn-next" class="btn-primary hidden">다음 문제 →</button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="parser.js"></script>
  <script src="app.js"></script>
</body>
</html>
